<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1080" height="360" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Proceso 2 — Comunidad / Proveedores (responder mínimo)</text>

  <!-- Pool / lane -->
  <rect x="30" y="70" width="1020" height="150" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="30" y="70" width="34" height="150" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="47" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46" transform="rotate(-90 47 145)">Proveedor</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#374151"/></marker>
  </defs>

  <!-- Start -->
  <circle cx="110" cy="145" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="#374151">inicio</text>

  <!-- Task 1: recibir convocatoria -->
  <rect x="175" y="118" width="170" height="54" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#312e81">Recibir convocatoria</text>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#6366f1">conector REST get</text>

  <!-- Task 2: evaluar y postular (user) -->
  <rect x="400" y="118" width="170" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="485" y="134" text-anchor="middle" font-size="12" fill="#713f12">Evaluar y postular</text>
  <text x="485" y="150" text-anchor="middle" font-size="11" fill="#a16207">(tarea humana)</text>
  <text x="485" y="165" text-anchor="middle" font-size="10" fill="#a16207">proveedor, monto, cert.</text>

  <!-- Task 3: enviar postulacion -->
  <rect x="625" y="118" width="170" height="54" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="710" y="140" text-anchor="middle" font-size="12" fill="#312e81">Enviar postulación</text>
  <text x="710" y="158" text-anchor="middle" font-size="11" fill="#6366f1">conector REST publish</text>

  <!-- End -->
  <circle cx="880" cy="145" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="880" y="185" text-anchor="middle" font-size="11" fill="#374151">fin</text>

  <!-- sequence flows -->
  <line x1="128" y1="145" x2="173" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="145" x2="398" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="145" x2="623" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="795" y1="145" x2="860" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Colas + message flows -->
  <g>
    <ellipse cx="260" cy="285" rx="78" ry="13" fill="#fde68a" stroke="#d97706"/>
    <rect x="182" y="285" width="156" height="30" fill="#fde68a" stroke="#d97706"/>
    <ellipse cx="260" cy="315" rx="78" ry="13" fill="#fcd34d" stroke="#d97706"/>
    <text x="260" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">rse.convocatorias</text>
  </g>
  <line x1="260" y1="272" x2="260" y2="174" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <g>
    <ellipse cx="710" cy="285" rx="78" ry="13" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="632" y="285" width="156" height="30" fill="#bfdbfe" stroke="#2563eb"/>
    <ellipse cx="710" cy="315" rx="78" ry="13" fill="#93c5fd" stroke="#2563eb"/>
    <text x="710" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">rse.postulaciones</text>
  </g>
  <line x1="710" y1="174" x2="710" y2="270" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
