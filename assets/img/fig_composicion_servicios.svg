<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1010" viewBox="0 0 1520 1010" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="1520" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="fv" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#3f9160"/>
    </marker>
    <marker id="fa" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#1f3b73"/>
    </marker>
    <marker id="fm" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#8a6fb0"/>
    </marker>
  </defs>

  <text x="760" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#1f3b73">Composición de Servicios mediados por Procesos de Negocio</text>
  <text x="760" y="74" text-anchor="middle" font-size="16" fill="#666">Sodimac — Aplicación BPM en entorno distribuido guiado por eventos</text>

  <!-- ============ CAPA CONSUMIDOR ============ -->
  <rect x="95" y="100" width="1385" height="100" rx="8" fill="#f2f6fc" stroke="#c3d3ea" stroke-width="1.5"/>
  <text x="115" y="124" font-size="13.5" font-weight="bold" fill="#1f3b73">CAPA DE CONSUMIDOR</text>
  <rect x="130" y="134" width="290" height="52" rx="6" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
  <text x="275" y="156" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f3b73">Living Application</text>
  <text x="275" y="175" text-anchor="middle" font-size="11.5" fill="#555">Rol → Procesos → Instancias → Status</text>
  <rect x="450" y="134" width="240" height="52" rx="6" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
  <text x="570" y="156" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f3b73">Portal Bonita</text>
  <text x="570" y="175" text-anchor="middle" font-size="11.5" fill="#555">UI Forms · tareas</text>
  <rect x="720" y="134" width="240" height="52" rx="6" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
  <text x="840" y="156" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f3b73">Frontend web</text>
  <text x="840" y="175" text-anchor="middle" font-size="11.5" fill="#555">Postventa · login por rol</text>
  <rect x="990" y="134" width="240" height="52" rx="6" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
  <text x="1110" y="156" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f3b73">Swagger UI</text>
  <text x="1110" y="175" text-anchor="middle" font-size="11.5" fill="#555">/docs · OpenAPI 3.0.3</text>

  <!-- ============ CAPA PROCESOS ============ -->
  <rect x="95" y="246" width="1385" height="174" rx="8" fill="#fff8ec" stroke="#e6c68a" stroke-width="1.5"/>
  <text x="115" y="238" font-size="13.5" font-weight="bold" fill="#8a5a00">CAPA DE PROCESOS DE NEGOCIO — Bonita (BPMN)</text>

  <rect x="130" y="284" width="560" height="120" rx="6" fill="#ffffff" stroke="#c99b3f" stroke-width="2.5"/>
  <text x="410" y="307" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">Proceso 1 — Gestión de RSE y Sostenibilidad</text>
  <rect x="148" y="318" width="165" height="40" rx="4" fill="#fdf3e0" stroke="#c99b3f"/>
  <text x="230" y="334" text-anchor="middle" font-size="11.5" fill="#333">Notificar áreas</text>
  <text x="230" y="349" text-anchor="middle" font-size="11.5" fill="#333">y aliados</text>
  <rect x="328" y="318" width="165" height="40" rx="4" fill="#fdf3e0" stroke="#c99b3f"/>
  <text x="410" y="334" text-anchor="middle" font-size="11.5" fill="#333">Consolidar KPIs</text>
  <text x="410" y="349" text-anchor="middle" font-size="11.5" fill="#333">y reporte base</text>
  <rect x="508" y="318" width="165" height="40" rx="4" fill="#fdf3e0" stroke="#c99b3f"/>
  <text x="590" y="334" text-anchor="middle" font-size="11.5" fill="#333">Recibir</text>
  <text x="590" y="349" text-anchor="middle" font-size="11.5" fill="#333">postulaciones</text>
  <text x="410" y="378" text-anchor="middle" font-size="11" fill="#777">8 tareas humanas · 5 de sistema · 3 gateways XOR</text>
  <text x="410" y="394" text-anchor="middle" font-size="11" fill="#777">BDM · 13 contratos · 3 UI Forms</text>

  <rect x="720" y="284" width="440" height="120" rx="6" fill="#ffffff" stroke="#c99b3f" stroke-width="2.5"/>
  <text x="940" y="307" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">Proceso 2 — Comunidad y Proveedores</text>
  <rect x="750" y="318" width="165" height="40" rx="4" fill="#fdf3e0" stroke="#c99b3f"/>
  <text x="832" y="334" text-anchor="middle" font-size="11.5" fill="#333">Recibir</text>
  <text x="832" y="349" text-anchor="middle" font-size="11.5" fill="#333">convocatoria</text>
  <rect x="960" y="318" width="165" height="40" rx="4" fill="#fdf3e0" stroke="#c99b3f"/>
  <text x="1042" y="334" text-anchor="middle" font-size="11.5" fill="#333">Enviar</text>
  <text x="1042" y="349" text-anchor="middle" font-size="11.5" fill="#333">postulación</text>
  <text x="940" y="386" text-anchor="middle" font-size="11" fill="#777">Contraparte externa del Proceso 1</text>

  <rect x="1200" y="284" width="250" height="120" rx="6" fill="#ffffff" stroke="#8a6fb0" stroke-width="2.5"/>
  <text x="1325" y="312" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#5b3f86">Servidor de correo</text>
  <text x="1325" y="332" text-anchor="middle" font-size="11.5" fill="#555">SMTP</text>
  <text x="1325" y="358" text-anchor="middle" font-size="11.5" fill="#777">Conector Email de Bonita</text>
  <text x="1325" y="388" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5a00">SERVICIO EXTERNO</text>

  <!-- correo: ruta por encima de las cajas -->
  <path d="M 230 318 L 230 270 L 1325 270 L 1325 284" stroke="#8a6fb0" stroke-width="2.2" fill="none" stroke-dasharray="7,5" marker-end="url(#fm)"/>
  <text x="770" y="264" text-anchor="middle" font-size="11.5" fill="#5b3f86" font-weight="bold">conector Email — notifica la convocatoria</text>

  <!-- ============ CAPA MENSAJERIA ============ -->
  <rect x="95" y="516" width="1385" height="114" rx="8" fill="#eef7f0" stroke="#a9cfb4" stroke-width="1.5"/>
  <text x="115" y="508" font-size="13.5" font-weight="bold" fill="#20603a">CAPA DE MENSAJERÍA — RabbitMQ (broker de mensajes)</text>

  <rect x="170" y="538" width="320" height="74" rx="6" fill="#ffffff" stroke="#3f9160" stroke-width="2.5"/>
  <text x="330" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20603a">rse.convocatorias</text>
  <text x="330" y="583" text-anchor="middle" font-size="11.5" fill="#555">Proceso 1 → servicios</text>
  <text x="330" y="600" text-anchor="middle" font-size="10.5" fill="#777">iniciativa aprobada</text>

  <rect x="620" y="538" width="320" height="74" rx="6" fill="#ffffff" stroke="#3f9160" stroke-width="2.5"/>
  <text x="780" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20603a">rse.postulaciones</text>
  <text x="780" y="583" text-anchor="middle" font-size="11.5" fill="#555">Proceso 2 → servicios</text>
  <text x="780" y="600" text-anchor="middle" font-size="10.5" fill="#777">propuesta del proveedor</text>

  <rect x="1070" y="538" width="320" height="74" rx="6" fill="#ffffff" stroke="#3f9160" stroke-width="2.5"/>
  <text x="1230" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20603a">rse.notificaciones</text>
  <text x="1230" y="583" text-anchor="middle" font-size="11.5" fill="#555">servicios → Proceso 1</text>
  <text x="1230" y="600" text-anchor="middle" font-size="10.5" fill="#777">resultado de tarea automática</text>

  <!-- ============ CAPA SERVICIOS ============ -->
  <rect x="95" y="726" width="1385" height="216" rx="8" fill="#f4f2fb" stroke="#c4bbe4" stroke-width="1.5"/>
  <text x="115" y="718" font-size="13.5" font-weight="bold" fill="#453080">CAPA DE SERVICIOS WEB — sodimac-servicios-rest (Python · Flask · DDD)</text>

  <rect x="140" y="750" width="290" height="62" rx="6" fill="#ffffff" stroke="#6a51c4" stroke-width="2.5"/>
  <text x="285" y="774" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#453080">API REST (run.py)</text>
  <text x="285" y="795" text-anchor="middle" font-size="11.5" fill="#555">adaptador HTTP · 76 operaciones</text>

  <rect x="460" y="750" width="290" height="62" rx="6" fill="#ffffff" stroke="#6a51c4" stroke-width="2.5"/>
  <text x="605" y="774" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#453080">Worker (worker.py)</text>
  <text x="605" y="795" text-anchor="middle" font-size="11.5" fill="#555">adaptador AMQP · consumidor</text>

  <rect x="140" y="828" width="610" height="42" rx="5" fill="#ffffff" stroke="#8b79d0" stroke-width="2"/>
  <text x="445" y="854" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#453080">Capa de Aplicación — casos de uso</text>
  <rect x="140" y="880" width="610" height="42" rx="5" fill="#ffffff" stroke="#8b79d0" stroke-width="2"/>
  <text x="445" y="906" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#453080">Capa de Dominio — agregados, servicios de dominio, fábricas</text>

  <rect x="790" y="750" width="650" height="172" rx="6" fill="#ffffff" stroke="#8b79d0" stroke-width="2"/>
  <text x="1115" y="772" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#453080">Bounded contexts (módulos)</text>
  <rect x="812" y="786" width="192" height="32" rx="4" fill="#f4f2fb" stroke="#a99ae0"/>
  <text x="908" y="807" text-anchor="middle" font-size="11.5" fill="#333">RSE y Sostenibilidad</text>
  <rect x="1018" y="786" width="192" height="32" rx="4" fill="#f4f2fb" stroke="#a99ae0"/>
  <text x="1114" y="807" text-anchor="middle" font-size="11.5" fill="#333">Venta y Atención</text>
  <rect x="1224" y="786" width="194" height="32" rx="4" fill="#f4f2fb" stroke="#a99ae0"/>
  <text x="1321" y="807" text-anchor="middle" font-size="11.5" fill="#333">Cadena de Suministro</text>
  <rect x="812" y="828" width="192" height="32" rx="4" fill="#f4f2fb" stroke="#a99ae0"/>
  <text x="908" y="849" text-anchor="middle" font-size="11.5" fill="#333">Servicios al Cliente</text>
  <rect x="1018" y="828" width="192" height="32" rx="4" fill="#f4f2fb" stroke="#a99ae0"/>
  <text x="1114" y="849" text-anchor="middle" font-size="11.5" fill="#333">Postventa</text>
  <rect x="1224" y="828" width="194" height="32" rx="4" fill="#f4f2fb" stroke="#a99ae0"/>
  <text x="1321" y="849" text-anchor="middle" font-size="11.5" fill="#333">Repositorios (puertos)</text>
  <text x="1115" y="884" text-anchor="middle" font-size="11" fill="#777">PostgreSQL · SQLAlchemy · dobles en memoria</text>
  <text x="1115" y="903" text-anchor="middle" font-size="11" fill="#777">DDD: entidades · objetos de valor · agregados · fábricas · servicios de dominio</text>

  <!-- ============ FLECHAS ============ -->
  <!-- P1 -> convocatorias -->
  <path d="M 230 358 L 230 452 L 290 452 L 290 538" stroke="#3f9160" stroke-width="2.5" fill="none" marker-end="url(#fv)"/>
  <text x="240" y="446" font-size="11.5" fill="#20603a" font-weight="bold">publica</text>

  <!-- P2 -> postulaciones -->
  <path d="M 1042 358 L 1042 476 L 860 476 L 860 538" stroke="#3f9160" stroke-width="2.5" fill="none" marker-end="url(#fv)"/>
  <text x="930" y="470" font-size="11.5" fill="#20603a" font-weight="bold">publica</text>

  <!-- notificaciones -> P1 (Consolidar KPIs) -->
  <path d="M 1150 538 L 1150 440 L 410 440 L 410 358" stroke="#3f9160" stroke-width="2.5" fill="none" marker-end="url(#fv)"/>
  <text x="770" y="434" text-anchor="middle" font-size="11.5" fill="#20603a" font-weight="bold">consume el resultado</text>

  <!-- convocatorias -> worker -->
  <path d="M 330 612 L 330 668 L 545 668 L 545 750" stroke="#3f9160" stroke-width="2.5" fill="none" marker-end="url(#fv)"/>
  <text x="352" y="662" font-size="11.5" fill="#20603a" font-weight="bold">consume</text>

  <!-- postulaciones -> worker -->
  <path d="M 780 612 L 780 690 L 665 690 L 665 750" stroke="#3f9160" stroke-width="2.5" fill="none" marker-end="url(#fv)"/>
  <text x="700" y="684" font-size="11.5" fill="#20603a" font-weight="bold">consume</text>

  <!-- worker -> notificaciones -->
  <path d="M 750 780 L 1470 780 L 1470 660 L 1230 660 L 1230 612" stroke="#3f9160" stroke-width="2.5" fill="none" marker-end="url(#fv)"/>
  <text x="1300" y="654" text-anchor="middle" font-size="11.5" fill="#20603a" font-weight="bold">publica el resultado</text>

  <!-- conector REST sincrono: Consolidar KPIs -> API REST (canal izquierdo) -->
  <path d="M 328 338 L 55 338 L 55 781 L 140 781" stroke="#1f3b73" stroke-width="2.5" fill="none" marker-end="url(#fa)"/>
  <text x="46" y="560" text-anchor="middle" font-size="12" fill="#1f3b73" font-weight="bold" transform="rotate(-90 46 560)">conector REST síncrono — GET /api/iniciativas/{codigo}/cumplimiento</text>

  <!-- leyenda -->
  <rect x="1130" y="956" width="350" height="46" rx="5" fill="#ffffff" stroke="#ccc"/>
  <line x1="1146" y1="972" x2="1180" y2="972" stroke="#3f9160" stroke-width="2.5"/>
  <text x="1188" y="976" font-size="11" fill="#555">mensajería asíncrona</text>
  <line x1="1320" y1="972" x2="1354" y2="972" stroke="#8a6fb0" stroke-width="2.2" stroke-dasharray="7,5"/>
  <text x="1362" y="976" font-size="11" fill="#555">correo (SMTP)</text>
  <line x1="1146" y1="992" x2="1180" y2="992" stroke="#1f3b73" stroke-width="2.5"/>
  <text x="1188" y="996" font-size="11" fill="#555">llamada REST síncrona</text>
</svg>
