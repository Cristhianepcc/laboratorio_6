services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-lab6
    hostname: rabbitmq-lab6
    ports:
      - "5672:5672"     # AMQP (protocolo nativo)
      - "15672:15672"   # Management UI + HTTP API (lo que usan los conectores REST de Bonita)
    # Usuario por defecto de la imagen: guest / guest
    # Declara las colas del lab al arrancar mediante definitions.json
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor de correo local para el conector Email de Bonita.
  # Captura todo lo que se le envia y lo muestra en una bandeja web, asi la
  # integracion con correo se demuestra sin cuentas reales ni salida a internet.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog-tif
    ports:
      - "1025:1025"   # SMTP: lo que configura el conector Email de Bonita
      - "8025:8025"   # Bandeja web: http://localhost:8025
